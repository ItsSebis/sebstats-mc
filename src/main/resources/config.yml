# Public address of the stats website, shown (as a clickable link) by /stats.
# Set this to your real URL, e.g. a Cloudflare tunnel hostname. Leave empty to hide the link.
website-url: "http://localhost:8123"

# Address and port the stats website listens on.
bind-address: 0.0.0.0
port: 8123

# How often (in seconds) online players' stats are re-read.
refresh-seconds: 3

# Celebrate play-time milestones (100, 250, 500, 1000 hours, then every 1000) with fireworks and an announcement.
celebrations: true

# Show a random fun fact (a comparison, a record, some trivia) as the server-list MOTD, replacing the usual one.
motd: true

# How often (in minutes) the MOTD fun fact changes.
motd-minutes: 15
