<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171c">
<title>SebStats</title>
<style>
  :root {
    --bg: #14171c; --panel: #1d2229; --panel-2: #262d36; --line: #323b46;
    --text: #e8ecf1; --muted: #8b97a6; --accent: #5fd068; --gold: #f2c14e; --silver: #b8c2cc; --bronze: #cd8b5a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .live { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .live.ok .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  nav { max-width: 1200px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; white-space: nowrap; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .row { display: grid; grid-template-columns: 22px 26px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; position: relative; }
  .row .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); opacity: .5; border-radius: 2px; }
  .rank { color: var(--muted); font-weight: 700; text-align: center; }
  .r1 .rank { color: var(--gold); } .r2 .rank { color: var(--silver); } .r3 .rank { color: var(--bronze); }
  .row img { width: 26px; height: 26px; border-radius: 4px; image-rendering: pixelated; background: var(--panel-2); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name i { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 4px 14px 4px 4px; cursor: pointer; font: inherit; }
  .chip img { width: 24px; height: 24px; border-radius: 50%; }
  .chip.active { border-color: var(--accent); background: var(--panel-2); }
  .progress { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; margin-bottom: 20px; }
  .meter { background: var(--panel-2); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; }
  .meter > div { height: 100%; background: var(--accent); }
  .progress .card b { font-size: 22px; }
  .coll-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .coll-tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); font: inherit; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .coll-tabs button.active { color: var(--text); border-color: var(--accent); }
  input[type=search] { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 12px; font: inherit; margin-left: auto; min-width: 180px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid hsl(var(--h) 60% 55%); border-radius: 6px; padding: 8px 10px; }
  .tile { display: flex; align-items: center; gap: 8px; }
  .tile .t { min-width: 0; }
  .icon { width: 24px; height: 24px; flex: none; image-rendering: pixelated; object-fit: contain; }
  .icon.sw { border-radius: 4px; background: hsl(var(--h) 45% 35%); }
  .tile .n { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .c { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
  .fact { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .fact .ico { font-size: 30px; line-height: 1; }
  .fact p { margin: 0; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .strip .chip b { font-variant-numeric: tabular-nums; }
  .strip .chip .pos { color: var(--muted); font-weight: 700; margin: 0 -2px 0 6px; }
  .strip .chip.r1 .pos { color: var(--gold); } .strip .chip.r2 .pos { color: var(--silver); } .strip .chip.r3 .pos { color: var(--bronze); }
  .adv { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); }
  .adv .icon { width: 32px; height: 32px; }
  .adv .info { flex: 1; min-width: 0; }
  .adv .d { color: var(--muted); font-size: 13px; }
  .adv .rar { background: var(--panel-2); height: 6px; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .adv .rar > div { height: 100%; background: var(--accent); }
  .adv .rar > div.rare { background: var(--gold); }
  .adv .side { text-align: right; min-width: 110px; }
  .adv .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .adv .pct.rare { color: var(--gold); }
  .faces { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; margin-top: 3px; }
  .faces img { width: 22px; height: 22px; border-radius: 4px; cursor: pointer; }
  .faces span { color: var(--muted); font-size: 12px; align-self: center; }
  .challenge { color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-left: 6px; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0; margin-bottom: 12px; }
  .back:hover { color: var(--text); }
  .phead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .phead img { width: 48px; height: 48px; border-radius: 6px; }
  .phead .grow { flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
  .acard { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .acard .icon { width: 32px; height: 32px; }
  .acard.locked { opacity: .5; }
  .acard.locked .icon { filter: grayscale(1); }
  .acard .when { font-size: 12px; color: var(--accent); }
  .acard.locked .when { color: var(--muted); }
  .acard.challenge-card { border-color: var(--gold); }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  /* ---- Server tab ---- */
  :root { --bad: #e5584f; --warn: #f08a3c; --blue: #6cb6ff; --violet: #b48cff; }
  .srv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .srv .card h3 { flex-wrap: wrap; }
  .srv .card h3 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: auto; }
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 20px; align-items: center; }
  .ring { width: 120px; height: 120px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .c b { font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring .c span { font-size: 11px; color: var(--muted); letter-spacing: .5px; margin-top: 2px; }
  .pill { display: inline-block; font-weight: 700; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid currentColor; }
  .hero .hd p { margin: 8px 0 0; color: var(--muted); }
  .kv { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; }
  .kv span { display: block; font-size: 12px; color: var(--muted); }
  .kv b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .g { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .g .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .g .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
  .g .big small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .g .sub { font-size: 12px; color: var(--muted); }
  .g .meter { margin: 4px 0 0; }
  .spark { width: 100%; height: 28px; display: block; margin-top: 4px; }
  .chartwrap { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .chartwrap svg { width: 100%; height: auto; display: block; }
  .tip { position: absolute; top: 2px; transform: translateX(-50%); pointer-events: none; display: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; }
  .axis { fill: var(--muted); font-size: 10px; }
  .heat { display: grid; grid-template-columns: 28px repeat(24, minmax(0, 1fr)); gap: 2px; }
  .heat .hc { aspect-ratio: 1; border-radius: 2px; background: var(--panel-2); opacity: .55; cursor: pointer; }
  .heat .hc[style] { opacity: 1; }
  .heat .hc.sel { outline: 2px solid var(--text); outline-offset: 0; position: relative; z-index: 1; }
  .heat .hl { font-size: 10px; color: var(--muted); align-self: center; }
  .heat .hh { font-size: 10px; color: var(--muted); grid-column: span 6; min-width: 0; white-space: nowrap; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin: 10px 0 0; }
  .legend i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--panel-2), var(--accent)); }
  .callout { margin-top: 10px; color: var(--muted); }
  .callout b { color: var(--text); }
  .wrow { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto; gap: 10px; align-items: center; padding: 3px 0; }
  .wrow .meter { margin: 0; }
  .bigcount { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .num { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  .num .ic { font-size: 22px; line-height: 1; }
  .num b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .num span { font-size: 12px; color: var(--muted); }
  .num i { display: block; font-style: normal; font-size: 11px; color: var(--muted); opacity: .85; margin-top: 2px; }
  .rec { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rec:first-of-type { border-top: 0; }
  .rec span { color: var(--muted); font-size: 13px; }
  .rec b { font-variant-numeric: tabular-nums; text-align: right; }
  .lg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .lg b { color: var(--text); font-variant-numeric: tabular-nums; }
  .stackbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--panel-2); margin: 10px 0 4px; gap: 1px; }
  .stackbar span { min-width: 2px; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pair span { display: block; font-size: 12px; color: var(--muted); }
  .warn { color: var(--warn); }
  @media (max-width: 900px) { .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) {
    body { font-size: 14px; }
    header { padding: 14px 12px 4px; gap: 6px 12px; }
    h1 { font-size: 22px; }
    nav { padding: 4px 12px 0; gap: 0; }
    nav button { padding: 10px 12px; }
    main { padding: 14px 12px 40px; }
    .grid, .facts { gap: 12px; }
    .chip, .coll-tabs button, .back { min-height: 40px; }
    .coll-tabs button { padding: 5px 14px; }
    .toolbar { align-items: stretch; }
    .toolbar .coll-tabs { width: 100%; }
    input[type=search] { margin-left: 0; width: 100%; min-width: 0; font-size: 16px; padding: 10px 12px; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 130px), 1fr)); }
    .adv { flex-wrap: wrap; gap: 8px 12px; }
    .adv .info { flex-basis: calc(100% - 44px); }
    .adv .side { min-width: 0; flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; flex-direction: row-reverse; text-align: left; padding-left: 44px; margin-top: -4px; }
    .faces { justify-content: flex-start; margin-top: 0; }
    .faces img { width: 26px; height: 26px; }
    .phead { gap: 10px; }
    .phead img { width: 40px; height: 40px; }
    .fact { padding: 12px; gap: 10px; }
    .srv { gap: 12px; }
    .ring { width: 104px; height: 104px; }
    .ring .c b { font-size: 24px; }
    .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gauges { gap: 10px; }
    .g { padding: 10px 12px; }
    .g .big { font-size: 22px; }
    .heat { gap: 1px; grid-template-columns: 26px repeat(24, minmax(0, 1fr)); }
    .bigcount { font-size: 28px; }
    .chartwrap .tip { font-size: 11px; }
  }
  @media (max-width: 360px) { .kv b { font-size: 15px; } .g .big { font-size: 20px; } }
  @media (hover: none) { .row, .adv { -webkit-tap-highlight-color: transparent; } }
</style>
</head>
<body>
<header>
  <h1>Seb<span>Stats</span></h1>
  <div id="live" class="live"><span class="dot"></span><span id="liveText">connecting…</span></div>
</header>
<nav id="tabs">
  <button data-tab="boards" class="active">Leaderboards</button>
  <button data-tab="collections">Collections</button>
  <button data-tab="achievements">Achievements</button>
  <button data-tab="facts">Fun Facts</button>
  <button data-tab="server">Server</button>
</nav>
<main id="view"></main>

<script>
const BOARDS = [
  { id: 'play_one_minute', title: '⏱️ Time Played', fmt: 'time' },
  { id: 'deaths', title: '💀 Deaths', fmt: 'num' },
  { id: 'deaths_per_hour', title: '🕊️ Deaths / Hour (fewest first)', fmt: 'rate', asc: true, keepZero: true,
    empty: 'Needs 6+ minutes of playtime',
    calc: p => (p.stats.play_one_minute || 0) >= MIN_RATE_TICKS ? (p.stats.deaths || 0) / (p.stats.play_one_minute / 72000) : null },
  { id: 'mined', title: '⛏️ Blocks Mined', fmt: 'num', coll: 'mined' },
  { id: 'crafted', title: '🛠️ Items Crafted', fmt: 'num', coll: 'crafted' },
  { id: 'mob_kills', title: '🗡️ Mob Kills', fmt: 'num' },
  { id: 'player_kills', title: '⚔️ Player Kills', fmt: 'num' },
  { id: 'damage_dealt', title: '💢 Damage Dealt', fmt: 'hearts' },
  { id: 'damage_taken', title: '🩸 Damage Taken', fmt: 'hearts' },
  { id: 'travel_cm', title: '🧭 Distance Travelled', fmt: 'dist' },
  { id: 'walk_one_cm', title: '🚶 Distance Walked', fmt: 'dist' },
  { id: 'aviate_one_cm', title: '🪂 Elytra Flight', fmt: 'dist' },
  { id: 'jump', title: '🦘 Jumps', fmt: 'num' },
  { id: 'fish_caught', title: '🎣 Fish Caught', fmt: 'num' },
  { id: 'animals_bred', title: '🐄 Animals Bred', fmt: 'num' },
  { id: 'traded_with_villager', title: '🤝 Villager Trades', fmt: 'num' },
  { id: 'sleep_in_bed', title: '🛏️ Nights Slept', fmt: 'num' },
  { id: 'raid_win', title: '🏰 Raids Won', fmt: 'num' },
  { id: 'totems_used', title: '🪬 Totems Used', fmt: 'num', calc: p => p.collections.used?.totem_of_undying || 0 },
];
const COLLECTIONS = [
  ['mined', 'Blocks Mined'], ['crafted', 'Crafted'], ['picked_up', 'Picked Up'],
  ['used', 'Used'], ['broken', 'Broken'], ['killed', 'Mobs Killed'], ['killed_by', 'Killed By'],
];
const MIN_RATE_TICKS = 7200; // 6 min played before a per-hour rate is meaningful
const FMT = {
  rate: v => v.toFixed(2),
  num: v => v.toLocaleString(),
  time: v => { const s = v / 20, h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; },
  dist: v => { const m = v / 100; return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; },
  hearts: v => '❤ ' + Math.round(v / 20).toLocaleString(),
};

let data = null, tab = 'boards', selected = null, collTab = 'mined', search = '';
let advCat = 'all', advSearch = '', advSort = 'rare', advPlayer = null;
const view = document.getElementById('view');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = k => k.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const avatar = p => `https://mc-heads.net/avatar/${p.uuid}/48`;

function value(p, b) {
  if (b.calc) return b.calc(p);
  if (b.coll) return Object.values(p.collections[b.coll] || {}).reduce((a, c) => a + c, 0);
  return p.stats[b.id] || 0;
}

function renderBoards() {
  return '<div class="grid">' + BOARDS.map(b => {
    const rows = data.players.map(p => ({ p, v: value(p, b) }))
      .filter(r => r.v !== null && (b.keepZero || r.v > 0))
      .sort((a, c) => b.asc ? a.v - c.v : c.v - a.v).slice(0, 10);
    const max = Math.max(...rows.map(r => r.v), 0) || 1;
    const bar = v => (b.asc ? (max ? 1 - v / max * 0.9 : 1) : v / max) * 100;
    const body = rows.length ? rows.map((r, i) => `
      <div class="row r${i + 1}">
        <span class="rank">${i + 1}</span><img src="${avatar(r.p)}" alt="" loading="lazy">
        <span class="name">${esc(r.p.name)}${r.p.online ? '<i title="online"></i>' : ''}</span>
        <span class="val">${FMT[b.fmt](r.v)}</span>
        <span class="bar" style="width:${bar(r.v).toFixed(1)}%"></span>
      </div>`).join('') : `<div class="empty">${b.empty || 'No data yet'}</div>`;
    return `<div class="card"><h3>${b.title}</h3>${body}</div>`;
  }).join('') + '</div>';
}

function renderCollections() {
  if (!data.players.length) return '<div class="empty">No players yet.</div>';
  if (!data.players.some(p => p.uuid === selected)) selected = data.players[0].uuid;
  const p = data.players.find(x => x.uuid === selected);
  const chips = data.players.map(x => `<button class="chip ${x.uuid === selected ? 'active' : ''}" data-player="${x.uuid}">
      <img src="${avatar(x)}" alt="">${esc(x.name)}</button>`).join('');
  const progress = [['mined', 'Blocks discovered'], ['crafted', 'Items crafted'], ['killed', 'Mob types killed']].map(([k, label]) => {
    const have = Object.keys(p.collections[k] || {}).length, total = data.catalog[k];
    return `<div class="card">${label}<br><b>${have}</b> <span style="color:var(--muted)">/ ${total}</span>
      <div class="meter"><div style="width:${(have / total * 100).toFixed(1)}%"></div></div></div>`;
  }).join('');
  const tabs = COLLECTIONS.map(([k, label]) =>
    `<button data-coll="${k}" class="${k === collTab ? 'active' : ''}">${label}</button>`).join('');
  return `<div class="chips">${chips}</div><div class="progress">${progress}</div>
    <div class="toolbar"><div class="coll-tabs">${tabs}</div>
    <input type="search" id="search" placeholder="Filter…" value="${esc(search)}"></div>
    <div id="tiles">${renderTiles(p)}</div>`;
}

// Icons come from PrismarineJS/minecraft-assets. Not every id has art (per-face blocks,
// mobs without spawn eggs), so each id walks a fallback chain and ends on a colored swatch.
const ICON_BASE = 'https://cdn.jsdelivr.net/gh/PrismarineJS/minecraft-assets@master/data/26.1/';
const iconCache = new Map(); // id -> working path, or null when nothing matched
const iconPaths = (k, mob) => mob ? [`items/${k}_spawn_egg`]
  : [`items/${k}`, `blocks/${k}`, `blocks/${k}_front`, `blocks/${k}_side`, `blocks/${k}_top`];
const swatch = k => `<span class="icon sw" style="--h:${hue(k)}"></span>`;

function iconHtml(k, mob) {
  const id = (mob ? 'm:' : 'i:') + k, hit = iconCache.get(id);
  if (hit === null) return swatch(k);
  return `<img class="icon" src="${ICON_BASE}${hit || iconPaths(k, mob)[0]}.png" data-k="${esc(k)}"
    data-mob="${mob ? 1 : 0}" data-i="${hit ? -1 : 0}" alt="" loading="lazy">`;
}

view.addEventListener('load', e => {
  const img = e.target; if (!img.classList?.contains('icon')) return;
  const i = +img.dataset.i; if (i < 0) return;
  iconCache.set((img.dataset.mob === '1' ? 'm:' : 'i:') + img.dataset.k, iconPaths(img.dataset.k, img.dataset.mob === '1')[i]);
}, true);

view.addEventListener('error', e => {
  const img = e.target; if (!img.classList?.contains('icon')) return;
  const mob = img.dataset.mob === '1', paths = iconPaths(img.dataset.k, mob), i = +img.dataset.i + 1;
  if (i < paths.length) { img.dataset.i = i; img.src = `${ICON_BASE}${paths[i]}.png`; return; }
  iconCache.set((mob ? 'm:' : 'i:') + img.dataset.k, null);
  img.outerHTML = swatch(img.dataset.k);
}, true);

function renderTiles(p) {

  const mob = collTab === 'killed' || collTab === 'killed_by';
  return '<div class="tiles">' + entries.map(([k, v]) => `

const CAT_LABEL = { story: 'Story', nether: 'Nether', end: 'The End', adventure: 'Adventure', husbandry: 'Husbandry', smp: 'SMP' };
const catLabel = c => CAT_LABEL[c] || pretty(c.replace(/[:/]/g, '_'));
const RARE_PCT = 15;
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : 'date unknown';

function advStats() {
  const n = data.players.length || 1;
  return data.advancements.map(a => {
    const who = data.players.filter(p => a.id in p.advancements);
    return { ...a, who, pct: who.length / n * 100 };
  });
}

function advToolbar() {
  const cats = ['all', ...new Set(data.advancements.map(a => a.category))];
  const tabs = cats.map(c =>
    `<button data-advcat="${esc(c)}" class="${c === advCat ? 'active' : ''}">${c === 'all' ? 'All' : esc(catLabel(c))}</button>`).join('');
  const sort = advPlayer ? '' : `<button data-advsort="1">${advSort === 'rare' ? 'Rarest first' : 'Most common first'}</button>`;
  return `<div class="toolbar"><div class="coll-tabs">${tabs}${sort}</div>
    <input type="search" id="advsearch" placeholder="Filter…" value="${esc(advSearch)}"></div>`;
}

function advMatches(a) {
  const q = advSearch.toLowerCase();
  return (advCat === 'all' || a.category === advCat)
    && (!q || a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q));
}

function renderAdvRows() {
  const rows = advStats().filter(advMatches);
  rows.sort((a, b) => {
    const z = (b.who.length > 0) - (a.who.length > 0); // never-earned ones go last either way
    return z || (advSort === 'rare' ? a.pct - b.pct : b.pct - a.pct) || a.title.localeCompare(b.title);
  });
  if (!rows.length) return '<div class="empty">No advancements match.</div>';
  return rows.map(a => {

function renderAchievements() {

function renderAdvOverview() {

const dur = ms => { const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);

  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">

/** Averages a series down to at most ~500 points; null marks a missing value (e.g. CPU not reported). */
function chartPoints(src, m, from) {
  const pts = [];
  for (let i = from; i < src.t.length; i++) {
    const v = src[m.key][i], e = m.ext ? src[m.ext][i] : null, e2 = m.ext2 ? src[m.ext2][i] : null;
    let st = null;
    if (m.stack) {
      st = m.stack.map(l => l.key ? src[l.key][i] : 0);
      st[st.length - 1] = Math.max(0, v - st.reduce((a, b) => a + b, 0)); // "other" = total minus the named kinds
    }
    pts.push({ t: src.t[i], v: v < 0 ? null : v, e: e !== null && e < 0 ? null : e, e2: e2 !== null && e2 < 0 ? null : e2, s: st });
  }
  const k = Math.ceil(pts.length / 500);
  if (k <= 1) return pts;
  const agg = (a, how) => !a.length ? null : how === 'min' ? Math.min(...a) : how === 'max' ? Math.max(...a) : a.reduce((s, x) => s + x, 0) / a.length;
  const out = [];
  for (let i = 0; i < pts.length; i += k) {
    const b = pts.slice(i, i + k);
    out.push({ t: b[b.length - 1].t, v: agg(b.map(p => p.v).filter(x => x !== null), 'avg'),
      e: agg(b.map(p => p.e).filter(x => x !== null), m.extAgg), e2: agg(b.map(p => p.e2).filter(x => x !== null), m.ext2Agg),
      s: b[0].s ? b[0].s.map((_, j) => agg(b.map(p => p.s[j]), 'avg')) : null });
  }
  return out;
}

function chartHtml() {
  const m = SRV_METRICS[srvMetric], big = srvRange === '30d', src = big ? srv.hourly : srv.recent;
  const cutoff = srv.updated / 1000 - SRV_RANGES[srvRange] * 3600;
  let from = src.t.findIndex(t => t >= cutoff);
  if (from < 0) from = src.t.length;
  const pts = chartPoints(src, m, from);
  chart = null;
  if (pts.length < 2) return '<div class="empty">Collecting data… the chart fills in after a couple of minutes.</div>';
  const vals = pts.flatMap(p => [p.v, p.e, p.e2]).filter(x => x !== null);
  if (!vals.length) return '<div class="empty">Not available on this host.</div>';

  const W = 600, H = 220, L = 40, R = 8, T = 10, B = 24, mx = Math.max(...vals);
  let lo = 0, hi;
  if (srvMetric === 'tps') { lo = Math.max(0, Math.floor(Math.min(...vals, 20)) - 2); hi = 20; }
  else if (srvMetric === 'mspt') hi = Math.max(60, niceMax(mx));
  else if (srvMetric === 'ram') hi = Math.max(srv.now.ramMax || 0, niceMax(mx));
  else if (srvMetric === 'cpu') hi = Math.max(20, niceMax(mx));
  else hi = Math.max(2, niceMax(mx));
  const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 1);
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const gap = big ? 7200 : 180;

  const segs = key => {
    const out = []; let cur = null;
    pts.forEach((p, i) => {
      if (p[key] === null || (cur && p.t - pts[i - 1].t > gap)) cur = null;
      if (p[key] === null) return;
      if (!cur) { cur = []; out.push(cur); }
      cur.push([X(p.t), Y(p[key])]);
    });
    return out.filter(s => s.length > 1);
  };
  const line = s => 'M' + s.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
  const area = s => `${line(s)}L${s[s.length - 1][0].toFixed(1)} ${Y(lo)}L${s[0][0].toFixed(1)} ${Y(lo)}Z`;
  const main = segs('v'), ext = m.ext ? segs('e') : [], ext2 = m.ext2 ? segs('e2') : [];

  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>
      <text class="axis" x="${L - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end">${Math.round(v * 10) / 10}</text>`;
  }
  const guide = (v, label) => v > lo && v < hi
    ? `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--bad)" stroke-dasharray="4 3" opacity=".6"/>
       <text class="axis" x="${W - R - 2}" y="${(Y(v) - 3).toFixed(1)}" text-anchor="end" style="fill:var(--bad)">${label}</text>` : '';
  g += srvMetric === 'tps' ? guide(18, 'lag') : srvMetric === 'mspt' ? guide(50, '50 ms budget') : '';
  for (let k = 0; k < 4; k++) {
    const t = t0 + (t1 - t0) * k / 3, d = new Date(t * 1000);
    const txt = big ? d.toLocaleDateString([], { day: 'numeric', month: 'short' }) : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    g += `<text class="axis" x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 3 ? 'end' : 'middle'}">${txt}</text>`;
  }
  (srv.restarts || []).filter(t => t > t0 && t < t1).forEach(t => {
    g += `<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="${T}" y2="${H - B}" style="stroke:var(--muted)" stroke-dasharray="2 3"/>
      <text class="axis" x="${(X(t) + 3).toFixed(1)}" y="${T + 9}">↻</text>`;
  });
  const col = m.color;
  if (m.stack) {
    // Contiguous runs of points (split at restarts), then one polygon per kind between its lower and upper edge.
    const runs = []; let cur = null;
    pts.forEach((p, i) => {
      if (p.v === null || (cur && p.t - pts[i - 1].t > gap)) cur = null;
      if (p.v === null) return;
      if (!cur) { cur = []; runs.push(cur); }
      cur.push(i);
    });
    const upTo = (i, li) => pts[i].s.slice(0, li + 1).reduce((a, b) => a + b, 0);
    m.stack.forEach((layer, li) => runs.filter(r => r.length > 1).forEach(r => {
      const top = r.map(i => `${X(pts[i].t).toFixed(1)} ${Y(upTo(i, li)).toFixed(1)}`);
      const bottom = r.slice().reverse().map(i => `${X(pts[i].t).toFixed(1)} ${Y(li ? upTo(i, li - 1) : 0).toFixed(1)}`);
      g += `<path d="M${top.join('L')}L${bottom.join('L')}Z" style="fill:${layer.color}" opacity=".78"/>`;
    }));
  } else {
    g += main.map(s => `<path d="${area(s)}" style="fill:${col}" opacity=".14"/>`).join('')
      + ext.map(s => `<path d="${line(s)}" fill="none" style="stroke:${m.extColor || 'var(--muted)'}" stroke-width="1" stroke-dasharray="3 2" opacity=".8"/>`).join('')
      + ext2.map(s => `<path d="${line(s)}" fill="none" style="stroke:${m.ext2Color || 'var(--muted)'}" stroke-width="1" stroke-dasharray="3 2" opacity=".8"/>`).join('')
      + main.map(s => `<path d="${line(s)}" fill="none" style="stroke:${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  }
  g += ''
    + `<line id="cur" y1="${T}" y2="${H - B}" style="stroke:var(--text);display:none" stroke-width="1" opacity=".6"/>`;

  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  chart = { pts, t0, t1, W, L, R, X, m };
  return `<div class="chartwrap" id="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${m.label} over the last ${srvRange}: average ${m.fmt(mean)}, lowest ${m.fmt(Math.min(...vals))}, highest ${m.fmt(mx)}">${g}</svg>
    <div class="tip" id="tip"></div></div>${m.stack ? `<div class="lg">${m.stack.map(l => `<span><i style="background:${l.color}"></i>${l.label}</span>`).join('')}</div>` : ''}`;
}

function scrub(e) {
  const w = e.target.closest?.('#chartwrap');
  if (!w || !chart) return;
  const r = w.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * chart.W;
  const frac = Math.min(1, Math.max(0, (xv - chart.L) / (chart.W - chart.L - chart.R)));
  const t = chart.t0 + frac * (chart.t1 - chart.t0);
  let a = 0, b = chart.pts.length - 1;
  while (b - a > 1) { const mid = (a + b) >> 1; if (chart.pts[mid].t <= t) a = mid; else b = mid; }
  const p = Math.abs(chart.pts[a].t - t) <= Math.abs(chart.pts[b].t - t) ? chart.pts[a] : chart.pts[b];
  scrubUntil = Date.now() + 3000;
  const x = chart.X(p.t), cur = w.querySelector('#cur'), tip = w.querySelector('#tip');
  cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.style.display = '';
  const when = new Date(p.t * 1000).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const extra = [[p.e, chart.m.extLabel], [p.e2, chart.m.ext2Label]].filter(([v]) => v !== null && v !== undefined)
    .map(([v, l]) => ` · ${l} ${chart.m.fmt(v)}`).join('');
  tip.innerHTML = chart.m.stack && p.s
    ? `${esc(when)}<br><b>${p.v === null ? 'n/a' : chart.m.fmt(p.v)}</b> total<br>${chart.m.stack.map((l, i) => `<span style="color:${l.color}">●</span> ${l.label} ${Math.round(p.s[i]).toLocaleString()}`).join('<br>')}`
    : `${esc(when)}<br><b>${p.v === null ? 'n/a' : chart.m.fmt(p.v)}</b>${extra}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(r.width - 70, Math.max(70, x / chart.W * r.width)) + 'px';
}
view.addEventListener('pointermove', scrub);
view.addEventListener('pointerdown', scrub);

function heatHtml() {
  const off = Math.round(-new Date().getTimezoneOffset() / 60); // UTC hour-of-week -> viewer's local hour-of-week
  const avg = Array(168).fill(0), cnt = Array(168).fill(0);
  for (let u = 0; u < 168; u++) { const l = ((u + off) % 168 + 168) % 168; avg[l] = srv.heatmap.avg[u]; cnt[l] = srv.heatmap.n[u]; }
  const hours = cnt.reduce((a, b) => a + b, 0);
  if (hours < 24) return `<div class="empty">Collecting data… ${hours} hour${hours === 1 ? '' : 's'} recorded so far. The heatmap fills in as the server runs.</div>`;
  const max = Math.max(...avg, 0.01);
  const slot = i => `${DAYS_LONG[Math.floor(i / 24)]} ${String(i % 24).padStart(2, '0')}:00`;
  let h = '<div class="heat" role="img" aria-label="Average players online by weekday and hour"><span></span>'
    + [0, 6, 12, 18].map(x => `<span class="hh">${String(x).padStart(2, '0')}:00</span>`).join('');
  for (let d = 0; d < 7; d++) {
    h += `<span class="hl">${DAYS[d]}</span>`;
    for (let hr = 0; hr < 24; hr++) {
      const i = d * 24 + hr;
      const bg = cnt[i] ? ` style="background:color-mix(in srgb, var(--accent) ${Math.max(8, Math.round(avg[i] / max * 100))}%, var(--panel-2))"` : '';
      h += `<span class="hc${heatSel === i ? ' sel' : ''}" data-hw="${i}"${bg}></span>`;
    }
  }
  h += '</div>';
  let best = 0;
  for (let i = 1; i < 168; i++) if (avg[i] > avg[best]) best = i;
  const dayAvg = DAYS.map((_, d) => { let s = 0, c = 0; for (let k = 0; k < 24; k++) if (cnt[d * 24 + k]) { s += avg[d * 24 + k]; c++; } return c ? s / c : 0; });
  const bestDay = dayAvg.indexOf(Math.max(...dayAvg));
  const info = heatSel !== null
    ? `<b>${slot(heatSel)}</b>: ${cnt[heatSel] ? `${avg[heatSel].toFixed(1)} players on average (${cnt[heatSel]} sample${cnt[heatSel] === 1 ? '' : 's'})` : 'no data yet'}`
    : `Busiest: <b>${slot(best)}</b> (${avg[best].toFixed(1)} players on average). Most active day: <b>${DAYS_LONG[bestDay]}</b>. Tap a cell for details.`;
  return `${h}<div class="legend">quiet<i></i>busy</div><div class="callout">${info}</div>`;
}

function chunksHtml(n) {
  const c = srv.chunks, worlds = Object.entries(c.perWorld).sort((a, b) => b[1] - a[1]);
  const maxD = Math.max(...c.perDay.values, 1), bw = 300 / c.perDay.values.length;
  const bars = c.perDay.values.map((v, i) => {
    const t = c.perDay.start + i * 86400, hgt = v ? Math.max(1.5, v / maxD * 54) : 0;
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(58 - hgt).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${hgt.toFixed(1)}" rx="1.5" style="fill:var(--accent)" opacity="${i === c.perDay.values.length - 1 ? 1 : .65}"><title>${fmtDay(t)}: ${v.toLocaleString()} new chunks</title></rect>`;
  }).join('');
  const rows = worlds.map(([name, v]) => `<div class="wrow"><span>${esc(pretty(name))}</span>
    <div class="meter"><div style="width:${(v / (c.total || 1) * 100).toFixed(1)}%"></div></div><b class="val">${v.toLocaleString()}</b></div>`).join('');
  return `<div class="bigcount" data-count="${c.total}" data-f="int">${c.total.toLocaleString()}</div>
    <div class="sub" style="color:var(--muted);margin-bottom:10px">chunks generated${c.since ? ` since tracking began on ${fmtDay(c.since / 1000)}` : ''}</div>
    ${rows}
    <div style="color:var(--muted);font-size:12px;margin:12px 0 4px">New chunks per day, last 30 days</div>
    <svg viewBox="0 0 300 60" style="width:100%;height:auto;display:block" role="img" aria-label="New chunks per day for the last 30 days">${bars}</svg>
    `;
}

function loadedHtml(n) {
  const b = n.entityBreakdown || {}, total = n.entities || 0;
  const parts = ENTITY_LAYERS.map(l => ({ ...l, v: b[l.id] || 0 }));
  const bar = parts.filter(p => p.v > 0).map(p => `<span style="flex:${p.v};background:${p.color}" title="${p.label}: ${p.v}"></span>`).join('');
  const legend = parts.map(p => `<span><i style="background:${p.color}"></i>${p.icon} ${p.label} <b>${p.v.toLocaleString()}</b></span>`).join('');
  const hot = b.hotspot
    ? `<div class="callout ${b.hotspot >= 80 ? 'warn' : ''}">Busiest chunk holds <b>${b.hotspot}</b> entities (${esc(pretty(b.hotspotWorld))})${b.hotspot >= 80 ? '. That is a likely lag source.' : '.'}</div>` : '';
  const worlds = (n.worlds || []).map(w => `<div class="wrow"><span>${esc(pretty(w.name))}</span><span style="color:var(--muted)">${w.chunks.toLocaleString()} chunks</span><b class="val">${w.entities.toLocaleString()}</b></div>`).join('');
  return `<div class="pair"><div><span>Chunks loaded</span><div class="bigcount">${(n.loadedChunks || 0).toLocaleString()}</div></div>
      <div><span>Entities loaded</span><div class="bigcount">${total.toLocaleString()}</div></div></div>
    <div class="stackbar" role="img" aria-label="Entities by kind">${bar}</div><div class="lg">${legend}</div>${hot}
    <div style="margin-top:12px">${worlds}</div>`;
}

function numbersHtml() {
  const t = srv.numbers || {};
  const tiles = NUM_TILES.filter(([, key]) => t[key] > 0).map(([ic, key, label, f, conv, cap]) => {
    const v = conv(t[key]);
    return `<div class="num"><div class="ic">${ic}</div><b data-count="${v}" data-f="${f}">${COUNT_FMT[f](v)}</b><span>${label}</span>${cap ? `<i>${cap(t[key], t)}</i>` : ''}</div>`;
  });
  return tiles.length ? `<div class="nums">${tiles.join('')}</div>` : '<div class="empty">Nothing to count yet.</div>';
}

function recordsHtml() {
  const r = srv.records, rows = [];
  if (r.peakOnline?.value > 0) rows.push(['👥 Most players at once', r.peakOnline.value, r.peakOnline.t]);
  if (r.lowestTps) rows.push(['🐌 Lowest TPS', r.lowestTps.value.toFixed(1), r.lowestTps.t]);
  if (r.longestUptime?.value > 0) rows.push(['⏳ Longest uptime', dur(r.longestUptime.value), r.longestUptime.t]);
  if (r.busiestDay) rows.push(['📅 Busiest day', `${r.busiestDay.playerHours} player-hours`, r.busiestDay.t]);
  const lag = `<div class="rec"><span>🥵 Lag spikes, last 24h</span><b>${r.lagMinutes24h ? `${r.lagMinutes24h} min below 18 TPS` : 'none'}</b></div>`;
  return rows.map(([l, v, t]) => `<div class="rec"><span>${l}</span><b>${v}<br><span>${fmtDay(t)}</span></b></div>`).join('') + lag;
}

function renderServer() {
  if (srvErr) return `<div class="empty">${esc(srvErr)}</div>`;
  if (!srv) return '<div class="empty">Loading server stats…</div>';
  const n = srv.now;
  if (n.tps === undefined) return '<div class="empty">The server just started. The first readings arrive in a few seconds…</div>';
  const ranges = Object.keys(SRV_RANGES).map(k => `<button data-range="${k}" class="${k === srvRange ? 'active' : ''}">${k}</button>`).join('');
  const metrics = Object.entries(SRV_METRICS).map(([k, m]) => `<button data-metric="${k}" class="${k === srvMetric ? 'active' : ''}">${m.label}</button>`).join('');
  return `<div class="srv">
    ${heroHtml(n)}
    ${gaugesHtml(n)}
    <div class="card"><h3>📈 History</h3>
      <div class="coll-tabs">${metrics}</div><div class="coll-tabs">${ranges}</div>${chartHtml()}
      <div class="sub" style="color:var(--muted);font-size:12px">Drag across the chart for exact values. ${SRV_METRICS[srvMetric].note || ''} ↻ marks a restart.</div></div>
    <div class="card"><h3>🔥 When is everyone online? <small>${Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g, ' ')}</small></h3>${heatHtml()}</div>
    <div class="card"><h3>🧩 What's loaded</h3>${loadedHtml(n)}</div>
    <div class="card"><h3>🗺️ World &amp; chunks</h3>${chunksHtml(n)}</div>
    <div><h3 style="margin:0 0 10px;font-size:15px">🌍 The server in numbers</h3>${numbersHtml()}</div>
    <div class="card"><h3>🏅 Hall of records</h3>${recordsHtml()}</div>
  </div>`;
}

/** Counts the big numbers up once, when the tab is first opened. */
function afterServer() {
  if (!srvFirst || !srv) return;
  srvFirst = false;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = [...view.querySelectorAll('[data-count]')], start = performance.now(), D = 800;
  const step = now => {
    const k = Math.min(1, (now - start) / D), e = 1 - (1 - k) ** 3;
    els.forEach(el => { el.textContent = COUNT_FMT[el.dataset.f](+el.dataset.count * e); });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function pollServer() {
  try {
    const res = await fetch('/api/server', { cache: 'no-store' });
    if (res.status === 404) { srvErr = 'Server stats are turned off on this server.'; srv = null; }
    else { srv = await res.json(); srvErr = ''; }
  } catch { return; }
  if (tab === 'server') render();
}

function render() {
  if (!data && tab !== 'server') return;
  if (tab === 'server' && Date.now() < scrubUntil) return; // don't rebuild the chart under a dragging finger
  const scroll = window.scrollY;
  view.innerHTML = { boards: renderBoards, collections: renderCollections, achievements: renderAchievements, facts: renderFacts, server: renderServer }[tab]();
  window.scrollTo(0, scroll);
  if (tab === 'server') afterServer();
}

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.dataset.tab; if (!t) return;
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  if (t === 'server') { srvFirst = true; pollServer(); }
  render();
});
view.addEventListener('click', e => {
  const c = e.target.closest('[data-player]'), k = e.target.closest('[data-coll]');
  if (c) { selected = c.dataset.player; render(); }
  if (k) { collTab = k.dataset.coll; render(); }
  const ap = e.target.closest('[data-advplayer]'), ac = e.target.closest('[data-advcat]');
  if (ap) { advPlayer = ap.dataset.advplayer; window.scrollTo(0, 0); render(); }
  if (e.target.closest('[data-advback]')) { advPlayer = null; render(); }
  if (ac) { advCat = ac.dataset.advcat; render(); }
  if (e.target.closest('[data-advsort]')) { advSort = advSort === 'rare' ? 'common' : 'rare'; render(); }
  const rg = e.target.closest('[data-range]'), mt = e.target.closest('[data-metric]'), hc = e.target.closest('[data-hw]');
  if (rg) { srvRange = rg.dataset.range; render(); }
  if (mt) { srvMetric = mt.dataset.metric; render(); }
  if (hc) { heatSel = +hc.dataset.hw; render(); }
});
view.addEventListener('input', e => {
  if (e.target.id === 'advsearch') {
    advSearch = e.target.value;
    const p = data.players.find(x => x.uuid === advPlayer);
    document.getElementById('advlist').innerHTML = p ? renderAdvCards(p) : renderAdvRows();
    return;
  }
  if (e.target.id !== 'search') return;
  search = e.target.value;
  document.getElementById('tiles').innerHTML = renderTiles(data.players.find(p => p.uuid === selected));
});

async function poll() {
  const live = document.getElementById('live'), text = document.getElementById('liveText');
  try {
    const next = await (await fetch('/api/stats', { cache: 'no-store' })).json();
    const changed = !data || JSON.stringify(next.players) !== JSON.stringify(data.players)
      || next.advancements.length !== data.advancements.length
      || JSON.stringify(next.facts) !== JSON.stringify(data.facts);
    data = next;
    live.classList.add('ok');
    text.textContent = `live · ${data.online} online`;
    if (changed && !['search', 'advsearch'].includes(document.activeElement?.id)) render();
  } catch {
    live.classList.remove('ok');
    text.textContent = 'offline, retrying…';
  }
}
poll();
setInterval(poll, 3000);
setInterval(() => { if (tab === 'server' && !document.hidden) pollServer(); }, 5000);
</script>
</body>
</html>
