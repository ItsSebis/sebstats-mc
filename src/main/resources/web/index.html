<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171c">
<title>SebStats</title>
<style>
  :root {
    --bg: #14171c; --panel: #1d2229; --panel-2: #262d36; --line: #323b46;
    --text: #e8ecf1; --muted: #8b97a6; --accent: #5fd068; --gold: #f2c14e; --silver: #b8c2cc; --bronze: #cd8b5a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .live { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .live.ok .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  nav { max-width: 1200px; margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; white-space: nowrap; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .row { display: grid; grid-template-columns: 22px 26px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; position: relative; }
  .row .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); opacity: .5; border-radius: 2px; }
  .rank { color: var(--muted); font-weight: 700; text-align: center; }
  .r1 .rank { color: var(--gold); } .r2 .rank { color: var(--silver); } .r3 .rank { color: var(--bronze); }
  .row img { width: 26px; height: 26px; border-radius: 4px; image-rendering: pixelated; background: var(--panel-2); }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name i { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 4px 14px 4px 4px; cursor: pointer; font: inherit; }
  .chip img { width: 24px; height: 24px; border-radius: 50%; }
  .chip.active { border-color: var(--accent); background: var(--panel-2); }
  .progress { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; margin-bottom: 20px; }
  .meter { background: var(--panel-2); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; }
  .meter > div { height: 100%; background: var(--accent); }
  .progress .card b { font-size: 22px; }
  .coll-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .coll-tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); font: inherit; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  .coll-tabs button.active { color: var(--text); border-color: var(--accent); }
  input[type=search] { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 12px; font: inherit; margin-left: auto; min-width: 180px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid hsl(var(--h) 60% 55%); border-radius: 6px; padding: 8px 10px; }
  .tile { display: flex; align-items: center; gap: 8px; }
  .tile .t { min-width: 0; }
  .icon { width: 24px; height: 24px; flex: none; image-rendering: pixelated; object-fit: contain; }
  .icon.sw { border-radius: 4px; background: hsl(var(--h) 45% 35%); }
  .tile .n { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .c { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
  .fact { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .fact .ico { font-size: 30px; line-height: 1; }
  .fact p { margin: 0; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .strip .chip b { font-variant-numeric: tabular-nums; }
  .strip .chip .pos { color: var(--muted); font-weight: 700; margin: 0 -2px 0 6px; }
  .strip .chip.r1 .pos { color: var(--gold); } .strip .chip.r2 .pos { color: var(--silver); } .strip .chip.r3 .pos { color: var(--bronze); }
  .adv { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); }
  .adv .icon { width: 32px; height: 32px; }
  .adv .info { flex: 1; min-width: 0; }
  .adv .d { color: var(--muted); font-size: 13px; }
  .adv .rar { background: var(--panel-2); height: 6px; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .adv .rar > div { height: 100%; background: var(--accent); }
  .adv .rar > div.rare { background: var(--gold); }
  .adv .side { text-align: right; min-width: 110px; }
  .adv .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .adv .pct.rare { color: var(--gold); }
  .faces { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; margin-top: 3px; }
  .faces img { width: 22px; height: 22px; border-radius: 4px; cursor: pointer; }
  .faces span { color: var(--muted); font-size: 12px; align-self: center; }
  .challenge { color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-left: 6px; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0; margin-bottom: 12px; }
  .back:hover { color: var(--text); }
  .phead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .phead img { width: 48px; height: 48px; border-radius: 6px; }
  .phead .grow { flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
  .acard { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .acard .icon { width: 32px; height: 32px; }
  .acard.locked { opacity: .5; }
  .acard.locked .icon { filter: grayscale(1); }
  .acard .when { font-size: 12px; color: var(--accent); }
  .acard.locked .when { color: var(--muted); }
  .acard.challenge-card { border-color: var(--gold); }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  @media (max-width: 600px) {
    body { font-size: 14px; }
    header { padding: 14px 12px 4px; gap: 6px 12px; }
    h1 { font-size: 22px; }
    nav { padding: 4px 12px 0; gap: 0; }
    nav button { padding: 10px 12px; }
    main { padding: 14px 12px 40px; }
    .grid, .facts { gap: 12px; }
    .chip, .coll-tabs button, .back { min-height: 40px; }
    .coll-tabs button { padding: 5px 14px; }
    .toolbar { align-items: stretch; }
    .toolbar .coll-tabs { width: 100%; }
    input[type=search] { margin-left: 0; width: 100%; min-width: 0; font-size: 16px; padding: 10px 12px; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 130px), 1fr)); }
    .adv { flex-wrap: wrap; gap: 8px 12px; }
    .adv .info { flex-basis: calc(100% - 44px); }
    .adv .side { min-width: 0; flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; flex-direction: row-reverse; text-align: left; padding-left: 44px; margin-top: -4px; }
    .faces { justify-content: flex-start; margin-top: 0; }
    .faces img { width: 26px; height: 26px; }
    .phead { gap: 10px; }
    .phead img { width: 40px; height: 40px; }
    .fact { padding: 12px; gap: 10px; }
  }
  @media (hover: none) { .row, .adv { -webkit-tap-highlight-color: transparent; } }
</style>
</head>
<body>
<header>
  <h1>Seb<span>Stats</span></h1>
  <div id="live" class="live"><span class="dot"></span><span id="liveText">connecting…</span></div>
</header>
<nav id="tabs">
  <button data-tab="boards" class="active">Leaderboards</button>
  <button data-tab="collections">Collections</button>
  <button data-tab="achievements">Achievements</button>
  <button data-tab="facts">Fun Facts</button>
</nav>
<main id="view"></main>

<script>
const BOARDS = [
  { id: 'play_one_minute', title: '⏱️ Time Played', fmt: 'time' },
  { id: 'deaths', title: '💀 Deaths', fmt: 'num' },
  { id: 'deaths_per_hour', title: '🕊️ Deaths / Hour (fewest first)', fmt: 'rate', asc: true, keepZero: true,
    empty: 'Needs 6+ minutes of playtime',
    calc: p => (p.stats.play_one_minute || 0) >= MIN_RATE_TICKS ? (p.stats.deaths || 0) / (p.stats.play_one_minute / 72000) : null },
  { id: 'mined', title: '⛏️ Blocks Mined', fmt: 'num', coll: 'mined' },
  { id: 'crafted', title: '🛠️ Items Crafted', fmt: 'num', coll: 'crafted' },
  { id: 'mob_kills', title: '🗡️ Mob Kills', fmt: 'num' },
  { id: 'player_kills', title: '⚔️ Player Kills', fmt: 'num' },
  { id: 'damage_dealt', title: '💢 Damage Dealt', fmt: 'hearts' },
  { id: 'damage_taken', title: '🩸 Damage Taken', fmt: 'hearts' },
  { id: 'travel_cm', title: '🧭 Distance Travelled', fmt: 'dist' },
  { id: 'walk_one_cm', title: '🚶 Distance Walked', fmt: 'dist' },
  { id: 'aviate_one_cm', title: '🪂 Elytra Flight', fmt: 'dist' },
  { id: 'jump', title: '🦘 Jumps', fmt: 'num' },
  { id: 'fish_caught', title: '🎣 Fish Caught', fmt: 'num' },
  { id: 'animals_bred', title: '🐄 Animals Bred', fmt: 'num' },
  { id: 'traded_with_villager', title: '🤝 Villager Trades', fmt: 'num' },
  { id: 'sleep_in_bed', title: '🛏️ Nights Slept', fmt: 'num' },
  { id: 'raid_win', title: '🏰 Raids Won', fmt: 'num' },
  { id: 'totems_used', title: '🪬 Totems Used', fmt: 'num', calc: p => p.collections.used?.totem_of_undying || 0 },
];
const COLLECTIONS = [
  ['mined', 'Blocks Mined'], ['crafted', 'Crafted'], ['picked_up', 'Picked Up'],
  ['used', 'Used'], ['broken', 'Broken'], ['killed', 'Mobs Killed'], ['killed_by', 'Killed By'],
];
const MIN_RATE_TICKS = 7200; // 6 min played before a per-hour rate is meaningful
const FMT = {
  rate: v => v.toFixed(2),
  num: v => v.toLocaleString(),
  time: v => { const s = v / 20, h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; },
  dist: v => { const m = v / 100; return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; },
  hearts: v => '❤ ' + Math.round(v / 20).toLocaleString(),
};

let data = null, tab = 'boards', selected = null, collTab = 'mined', search = '';
let advCat = 'all', advSearch = '', advSort = 'rare', advPlayer = null;
const view = document.getElementById('view');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pretty = k => k.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const avatar = p => `https://mc-heads.net/avatar/${p.uuid}/48`;

function value(p, b) {
  if (b.calc) return b.calc(p);
  if (b.coll) return Object.values(p.collections[b.coll] || {}).reduce((a, c) => a + c, 0);
  return p.stats[b.id] || 0;
}

function renderBoards() {
  return '<div class="grid">' + BOARDS.map(b => {
    const rows = data.players.map(p => ({ p, v: value(p, b) }))
      .filter(r => r.v !== null && (b.keepZero || r.v > 0))
      .sort((a, c) => b.asc ? a.v - c.v : c.v - a.v).slice(0, 10);
    const max = Math.max(...rows.map(r => r.v), 0) || 1;
    const bar = v => (b.asc ? (max ? 1 - v / max * 0.9 : 1) : v / max) * 100;
    const body = rows.length ? rows.map((r, i) => `
      <div class="row r${i + 1}">
        <span class="rank">${i + 1}</span><img src="${avatar(r.p)}" alt="" loading="lazy">
        <span class="name">${esc(r.p.name)}${r.p.online ? '<i title="online"></i>' : ''}</span>
        <span class="val">${FMT[b.fmt](r.v)}</span>
        <span class="bar" style="width:${bar(r.v).toFixed(1)}%"></span>
      </div>`).join('') : `<div class="empty">${b.empty || 'No data yet'}</div>`;
    return `<div class="card"><h3>${b.title}</h3>${body}</div>`;
  }).join('') + '</div>';
}

function renderCollections() {
  if (!data.players.length) return '<div class="empty">No players yet.</div>';
  if (!data.players.some(p => p.uuid === selected)) selected = data.players[0].uuid;
  const p = data.players.find(x => x.uuid === selected);
  const chips = data.players.map(x => `<button class="chip ${x.uuid === selected ? 'active' : ''}" data-player="${x.uuid}">
      <img src="${avatar(x)}" alt="">${esc(x.name)}</button>`).join('');
  const progress = [['mined', 'Blocks discovered'], ['crafted', 'Items crafted'], ['killed', 'Mob types killed']].map(([k, label]) => {
    const have = Object.keys(p.collections[k] || {}).length, total = data.catalog[k];
    return `<div class="card">${label}<br><b>${have}</b> <span style="color:var(--muted)">/ ${total}</span>
      <div class="meter"><div style="width:${(have / total * 100).toFixed(1)}%"></div></div></div>`;
  }).join('');
  const tabs = COLLECTIONS.map(([k, label]) =>
    `<button data-coll="${k}" class="${k === collTab ? 'active' : ''}">${label}</button>`).join('');
  return `<div class="chips">${chips}</div><div class="progress">${progress}</div>
    <div class="toolbar"><div class="coll-tabs">${tabs}</div>
    <input type="search" id="search" placeholder="Filter…" value="${esc(search)}"></div>
    <div id="tiles">${renderTiles(p)}</div>`;
}

// Icons come from PrismarineJS/minecraft-assets. Not every id has art (per-face blocks,
// mobs without spawn eggs), so each id walks a fallback chain and ends on a colored swatch.
const ICON_BASE = 'https://cdn.jsdelivr.net/gh/PrismarineJS/minecraft-assets@master/data/26.1/';
const iconCache = new Map(); // id -> working path, or null when nothing matched
const iconPaths = (k, mob) => mob ? [`items/${k}_spawn_egg`]
  : [`items/${k}`, `blocks/${k}`, `blocks/${k}_front`, `blocks/${k}_side`, `blocks/${k}_top`];
const swatch = k => `<span class="icon sw" style="--h:${hue(k)}"></span>`;

function iconHtml(k, mob) {
  const id = (mob ? 'm:' : 'i:') + k, hit = iconCache.get(id);
  if (hit === null) return swatch(k);
  return `<img class="icon" src="${ICON_BASE}${hit || iconPaths(k, mob)[0]}.png" data-k="${esc(k)}"
    data-mob="${mob ? 1 : 0}" data-i="${hit ? -1 : 0}" alt="" loading="lazy">`;
}

view.addEventListener('load', e => {
  const img = e.target; if (!img.classList?.contains('icon')) return;
  const i = +img.dataset.i; if (i < 0) return;
  iconCache.set((img.dataset.mob === '1' ? 'm:' : 'i:') + img.dataset.k, iconPaths(img.dataset.k, img.dataset.mob === '1')[i]);
}, true);

view.addEventListener('error', e => {
  const img = e.target; if (!img.classList?.contains('icon')) return;
  const mob = img.dataset.mob === '1', paths = iconPaths(img.dataset.k, mob), i = +img.dataset.i + 1;
  if (i < paths.length) { img.dataset.i = i; img.src = `${ICON_BASE}${paths[i]}.png`; return; }
  iconCache.set((mob ? 'm:' : 'i:') + img.dataset.k, null);
  img.outerHTML = swatch(img.dataset.k);
}, true);

function renderTiles(p) {
  const q = search.toLowerCase();
  const entries = Object.entries(p.collections[collTab] || {})
    .filter(([k]) => k.replace(/_/g, ' ').includes(q)).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<div class="empty">Nothing here yet.</div>';
  const mob = collTab === 'killed' || collTab === 'killed_by';
  return '<div class="tiles">' + entries.map(([k, v]) => `
    <div class="tile" style="--h:${hue(k)}">${iconHtml(k, mob)}<div class="t">
    <div class="n" title="${esc(pretty(k))}">${esc(pretty(k))}</div>
    <div class="c">${v.toLocaleString()}</div></div></div>`).join('') + '</div>';
}

const CAT_LABEL = { story: 'Story', nether: 'Nether', end: 'The End', adventure: 'Adventure', husbandry: 'Husbandry', smp: 'SMP' };
const catLabel = c => CAT_LABEL[c] || pretty(c.replace(/[:/]/g, '_'));
const RARE_PCT = 15;
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : 'date unknown';

function advStats() {
  const n = data.players.length || 1;
  return data.advancements.map(a => {
    const who = data.players.filter(p => a.id in p.advancements);
    return { ...a, who, pct: who.length / n * 100 };
  });
}

function advToolbar() {
  const cats = ['all', ...new Set(data.advancements.map(a => a.category))];
  const tabs = cats.map(c =>
    `<button data-advcat="${esc(c)}" class="${c === advCat ? 'active' : ''}">${c === 'all' ? 'All' : esc(catLabel(c))}</button>`).join('');
  const sort = advPlayer ? '' : `<button data-advsort="1">${advSort === 'rare' ? 'Rarest first' : 'Most common first'}</button>`;
  return `<div class="toolbar"><div class="coll-tabs">${tabs}${sort}</div>
    <input type="search" id="advsearch" placeholder="Filter…" value="${esc(advSearch)}"></div>`;
}

function advMatches(a) {
  const q = advSearch.toLowerCase();
  return (advCat === 'all' || a.category === advCat)
    && (!q || a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q));
}

function renderAdvRows() {
  const rows = advStats().filter(advMatches);
  rows.sort((a, b) => {
    const z = (b.who.length > 0) - (a.who.length > 0); // never-earned ones go last either way
    return z || (advSort === 'rare' ? a.pct - b.pct : b.pct - a.pct) || a.title.localeCompare(b.title);
  });
  if (!rows.length) return '<div class="empty">No advancements match.</div>';
  return rows.map(a => {
    const rare = a.pct < RARE_PCT;
    const faces = a.who.slice(0, 8).map(p =>
      `<img src="${avatar(p)}" title="${esc(p.name)}" data-advplayer="${p.uuid}" alt="" loading="lazy">`).join('')
      + (a.who.length > 8 ? `<span>+${a.who.length - 8}</span>` : '');
    return `<div class="adv">${iconHtml(a.icon, false)}
      <div class="info"><b>${esc(a.title)}</b>${a.frame === 'challenge' ? '<span class="challenge">challenge</span>' : ''}
        <div class="d">${esc(a.description)} <span style="opacity:.6">· ${esc(catLabel(a.category))}</span></div>
        <div class="rar"><div class="${rare ? 'rare' : ''}" style="width:${a.pct.toFixed(1)}%"></div></div></div>
      <div class="side"><div class="pct ${rare && a.who.length ? 'rare' : ''}">${a.pct.toFixed(a.pct < 10 && a.pct > 0 ? 1 : 0)}%</div>
        <div class="faces">${faces}</div></div></div>`;
  }).join('');
}

function renderAchievements() {
  if (!data.advancements?.length) return '<div class="empty">No advancement data yet.</div>';
  if (advPlayer && !data.players.some(p => p.uuid === advPlayer)) advPlayer = null;
  return advPlayer ? renderAdvPlayer() : renderAdvOverview();
}

function renderAdvOverview() {
  const total = data.advancements.length;
  const ranked = [...data.players].sort((a, b) =>
    Object.keys(b.advancements).length - Object.keys(a.advancements).length || a.name.localeCompare(b.name));
  const strip = ranked.map((p, i) => `<button class="chip r${i + 1}" data-advplayer="${p.uuid}">
      <span class="pos">${i + 1}</span><img src="${avatar(p)}" alt="">${esc(p.name)}
      <b>${Object.keys(p.advancements).length}</b><span style="color:var(--muted)">/ ${total}</span></button>`).join('');
  return `<div class="strip">${strip}</div>${advToolbar()}<div id="advlist" class="card">${renderAdvRows()}</div>`;
}

function renderAdvCards(p) {
  const rows = advStats().filter(advMatches);
  rows.sort((a, b) => {
    const ea = a.id in p.advancements, eb = b.id in p.advancements;
    if (ea !== eb) return ea ? -1 : 1;
    return ea ? (p.advancements[b.id] - p.advancements[a.id]) : (b.pct - a.pct) || a.title.localeCompare(b.title);
  });
  if (!rows.length) return '<div class="empty">No advancements match.</div>';
  return '<div class="cards">' + rows.map(a => {
    const got = a.id in p.advancements;
    const when = got ? `Earned ${fmtDate(p.advancements[a.id])}` : 'Locked';
    return `<div class="acard ${got ? '' : 'locked'} ${got && a.frame === 'challenge' ? 'challenge-card' : ''}">${iconHtml(a.icon, false)}
      <div><b>${esc(a.title)}</b><div class="d" style="color:var(--muted);font-size:13px">${esc(a.description)}</div>
      <div class="when">${when} · ${a.pct.toFixed(a.pct < 10 && a.pct > 0 ? 1 : 0)}% of players</div></div></div>`;
  }).join('') + '</div>';
}

function renderAdvPlayer() {
  const p = data.players.find(x => x.uuid === advPlayer);
  const total = data.advancements.length, have = Object.keys(p.advancements).length;
  const cats = [...new Set(data.advancements.map(a => a.category))].map(c => {
    const all = data.advancements.filter(a => a.category === c);
    return `${esc(catLabel(c))} <b style="color:var(--text)">${all.filter(a => a.id in p.advancements).length}/${all.length}</b>`;
  }).join(' &nbsp;·&nbsp; ');
  return `<button class="back" data-advback="1">← All players</button>
    <div class="phead"><img src="${avatar(p)}" alt=""><div class="grow">
      <b style="font-size:20px">${esc(p.name)}</b> <span style="color:var(--muted)">· ${have} / ${total} advancements (${(have / total * 100).toFixed(0)}%)</span>
      <div class="meter"><div style="width:${(have / total * 100).toFixed(1)}%"></div></div></div></div>
    <div style="color:var(--muted);margin-bottom:14px">${cats}</div>
    ${advToolbar()}<div id="advlist">${renderAdvCards(p)}</div>`;
}

function renderFacts() {
  return '<div class="facts">' + data.facts.map(f =>
    `<div class="fact"><div class="ico">${f.icon}</div><p>${esc(f.text)}</p></div>`).join('') + '</div>';
}

function render() {
  if (!data) return;
  const scroll = window.scrollY;
  view.innerHTML = { boards: renderBoards, collections: renderCollections, achievements: renderAchievements, facts: renderFacts }[tab]();
  window.scrollTo(0, scroll);
}

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.dataset.tab; if (!t) return;
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
});
view.addEventListener('click', e => {
  const c = e.target.closest('[data-player]'), k = e.target.closest('[data-coll]');
  if (c) { selected = c.dataset.player; render(); }
  if (k) { collTab = k.dataset.coll; render(); }
  const ap = e.target.closest('[data-advplayer]'), ac = e.target.closest('[data-advcat]');
  if (ap) { advPlayer = ap.dataset.advplayer; window.scrollTo(0, 0); render(); }
  if (e.target.closest('[data-advback]')) { advPlayer = null; render(); }
  if (ac) { advCat = ac.dataset.advcat; render(); }
  if (e.target.closest('[data-advsort]')) { advSort = advSort === 'rare' ? 'common' : 'rare'; render(); }
});
view.addEventListener('input', e => {
  if (e.target.id === 'advsearch') {
    advSearch = e.target.value;
    const p = data.players.find(x => x.uuid === advPlayer);
    document.getElementById('advlist').innerHTML = p ? renderAdvCards(p) : renderAdvRows();
    return;
  }
  if (e.target.id !== 'search') return;
  search = e.target.value;
  document.getElementById('tiles').innerHTML = renderTiles(data.players.find(p => p.uuid === selected));
});

async function poll() {
  const live = document.getElementById('live'), text = document.getElementById('liveText');
  try {
    const next = await (await fetch('/api/stats', { cache: 'no-store' })).json();
    const changed = !data || JSON.stringify(next.players) !== JSON.stringify(data.players)
      || next.advancements.length !== data.advancements.length
      || JSON.stringify(next.facts) !== JSON.stringify(data.facts);
    data = next;
    live.classList.add('ok');
    text.textContent = `live · ${data.online} online`;
    if (changed && !['search', 'advsearch'].includes(document.activeElement?.id)) render();
  } catch {
    live.classList.remove('ok');
    text.textContent = 'offline, retrying…';
  }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
